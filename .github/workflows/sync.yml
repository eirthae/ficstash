name: Sync

# Runs the FicStash worker: downloads requested links/saves, repairs metadata,
# discovers tracked-tag matches from AO3's PUBLIC pages, and backfills offline
# copies — all logged-out, no account import. Runs on a schedule and on demand.
# All credentials come from repo secrets and are passed by name — never printed.
on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Re-check ALL works (status, new chapters, AO3 series), not just ongoing ones"
        type: boolean
        default: false
      saves_only:
        description: "Fast path: fetch only requested links + saves, then stop (real-time Save)"
        type: boolean
        default: false
      series_sweep:
        description: "AO3 series follows: full (with everything), skip (nightly), or only (weekly sweep)"
        type: choice
        options: ["full", "skip", "only"]
        default: "full"
      reseed_tags:
        description: "Re-fetch ALL discover tags all-time (refresh metadata e.g. descriptions; keeps saved/seen/dismissed)"
        type: boolean
        default: false
      only_group:
        description: "Discovery for ONE tracked group id, skipping every other pass (the app's per-group Sync buttons)"
        type: string
        default: ""
  schedule:
    # NIGHTLY — tracked tags + new chapters. 18:37 Japan time (JST = UTC+9).
    #
    # NOT on the hour, deliberately. GitHub's docs: "The schedule event can be
    # delayed during periods of high loads... High load times include the start
    # of every hour. To decrease the chance of delay, schedule your workflow to
    # run at a different time of the hour." Both crons here sat at :00 — the
    # single busiest minute — which is part of why runs landed 2-6 hours late
    # (observed 19:54-23:59 UTC against an 18:00 cron).
    # Moved from 18:00 UTC (03:00 JST): GitHub delays scheduled runs by hours
    # under load (observed 20:19-23:59 UTC against an 18:00 cron), and a sweep
    # can take up to 5h, so results were landing mid-morning to mid-afternoon.
    # Starting in the evening JST means even a delayed, long run finishes
    # overnight and there is something new to read by morning.
    # Skips the AO3 series sweep: re-enumerating 108 follows every night ate the
    # whole time budget before discovery and refresh ran, so tags stopped
    # updating and new chapters stopped being detected entirely.
    - cron: "37 9 * * *"
    # WEEKLY — AO3 series follows only. Friday 09:19 JST = Friday 00:19 UTC.
    # Off the hour for the same reason as the nightly; midnight UTC on the hour
    # is the worst slot on the clock.
    # The expensive pass gets its own long run instead of starving the nightly.
    # A tapped "Download all" never waits for this: that goes through the
    # saves-only fast lane, which enumerates new/one-shot series immediately.
    - cron: "19 0 * * 5"

# Don't let a scheduled run and a manual run hammer AO3 at the same time.
# Saves-only (real-time Save) runs in their OWN lane so they fire immediately
# instead of queuing behind a full sweep.
# `inputs.saves_only` is a BOOLEAN — comparing it to the string 'true' always
# evaluated false, so every save landed in the sweep lane, queued behind it, and
# GitHub cancelled whichever run was left pending.
concurrency:
  group: ${{ inputs.saves_only && 'ficstash-save' || 'ficstash-sync' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Safety net so a genuinely wedged run can't hang to GitHub's 6-hour default.
    # Raised 180 -> 330: the library keeps growing, and the old cap meant the last
    # passes (discovery, then new-chapter refresh) were simply dropped when time
    # ran out. MAX_RUN_MINUTES below stops work cleanly well before this.
    timeout-minutes: 330
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # "Re-check ALL works" toggle on a manual run → full library revamp.
          FULL_REFRESH: ${{ inputs.full_refresh && '1' || '' }}
          SAVES_ONLY: ${{ inputs.saves_only && '1' || '' }}
          # Which series work this run does. The Friday 00:00 UTC schedule sweeps
          # series ONLY; every other scheduled run skips them. A manual run
          # defaults to 'full' (everything), matching the old behaviour.
          SERIES_SWEEP: ${{ github.event_name == 'schedule' && (github.event.schedule == '19 0 * * 5' && 'only' || 'skip') || inputs.series_sweep || 'full' }}
          # Clean-exit budget: the worker stops STARTING new work at this point so
          # it shuts down tidily instead of being killed by timeout-minutes above.
          # Tune via the repo variable MAX_RUN_MINUTES with no code change.
          MAX_RUN_MINUTES: ${{ vars.MAX_RUN_MINUTES || '300' }}
          # One-shot: re-fetch every discover tag all-time so existing matches get
          # refreshed metadata (e.g. backfilled descriptions). Keeps saved/seen flags.
          RESEED_TAGS: ${{ inputs.reseed_tags && '1' || '' }}
          # One tracked group, discovery only — dispatched by the app's per-group
          # Sync buttons. The phone can't do this itself: on-device AO3 search is
          # logged out and has never once succeeded, while this worker is logged
          # in and searches fine. With reseed_tags it's the all-time catch-up.
          ONLY_GROUP: ${{ inputs.only_group || '' }}
          # How long works/new chapters stay in What's New (days). This prune is
          # a DELETE, not a hide, so too low means a chapter notice is destroyed
          # before you ever see it — at the old default of 1, missing a single
          # day meant never learning a chapter had landed. The fallback is 8 to
          # match the app's feed windows; override with the repo variable
          # WHATS_NEW_DAYS. The library itself keeps everything regardless.
          WHATS_NEW_DAYS: ${{ vars.WHATS_NEW_DAYS || '8' }}
          # How long an UNTOUCHED discovery suggestion survives. The prune only
          # removes matches you never acted on (not saved / Later / wanted /
          # failed), but at 30 days that quietly erodes a quiet tag's backlog —
          # its one all-time seed is never re-fetched, so once those rows age out
          # the group reads as empty even though the tag has works. Raised to 90;
          # override with the repo variable MATCH_RETENTION_DAYS.
          MATCH_RETENTION_DAYS: ${{ vars.MATCH_RETENTION_DAYS || '90' }}
          # Optional AO3 login: when these secrets are set the worker logs in so it
          # can fetch members-only / registered-users-only works (e.g. series works
          # a guest can't get). If unset, it runs logged-out on public pages. The
          # password is passed by name and never printed.
          AO3_USERNAME: ${{ secrets.AO3_USERNAME }}
          AO3_PASSWORD: ${{ secrets.AO3_PASSWORD }}
        run: python main.py
